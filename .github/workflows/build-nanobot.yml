name: Build Nanobot Binary

on:
  push:
    branches: [main]
    paths:
      - 'build_nano.py'
      - 'build_nano.spec'
      - '.github/workflows/build-nanobot.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.4)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-latest
            platform: macos
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: ubuntu-22.04
            platform: linux
            arch: amd64

    runs-on: ${{ matrix.os }}
    name: Build nanobot (${{ matrix.platform }}-${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          set -ex
          python3 -m venv /tmp/nanobot-env
          source /tmp/nanobot-env/bin/activate
          pip install --upgrade pip
          pip install nanobot-ai pyinstaller
          python3 -c "import nanobot; print('nanobot OK')"
          python3 -m PyInstaller --version
          python3 -c "import site; print(site.getsitepackages()[0])"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv C:\nanobot-env
          C:\nanobot-env\Scripts\activate
          pip install --upgrade pip
          pip install nanobot-ai pyinstaller
          python -c "import nanobot; print('nanobot OK')"
          python -m PyInstaller --version
          python -c "import site; print(site.getsitepackages()[0])"
        shell: pwsh

      - name: Build nanobot binary (Unix)
        if: runner.os != 'Windows'
        run: |
          set -ex
          source /tmp/nanobot-env/bin/activate
          SITE_PKGS=$(python3 -c "import site; print(site.getsitepackages()[0])")
          echo "Site-packages: $SITE_PKGS"
          NANOBOT_ROOT="/tmp/nanobot-env" \
          NANOBOT_SITE_PACKAGES="$SITE_PKGS" \
          NANOBOT_PYTHON="$(which python3)" \
          python3 build_nano.py

      - name: Build nanobot binary (Windows)
        if: runner.os == 'Windows'
        run: |
          C:\nanobot-env\Scripts\activate
          $sitePkgs = python -c "import site; print(site.getsitepackages()[0])"
          Write-Host "Site-packages: $sitePkgs"
          $env:NANOBOT_ROOT = "C:\nanobot-env"
          $env:NANOBOT_SITE_PACKAGES = $sitePkgs
          $env:NANOBOT_PYTHON = "C:\nanobot-env\Scripts\python.exe"
          python build_nano.py
        shell: pwsh

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        run: |
          ls -lh nanobot-bin/
          ./nanobot-bin/nanobot --version

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        run: |
          ls nanobot-bin/
          .\nanobot-bin\nanobot.exe --version
        shell: pwsh

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/nanobot-bin
          cp nanobot-bin/nanobot dist/nanobot-bin/
          chmod +x dist/nanobot-bin/nanobot
          cd dist
          tar czf nanobot-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz nanobot-bin/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist\nanobot-bin
          copy nanobot-bin\nanobot.exe dist\nanobot-bin\
          cd dist
          Compress-Archive -Path nanobot-bin -DestinationPath nanobot-${{ matrix.platform }}-${{ matrix.arch }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanobot-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/nanobot-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            dist/nanobot-${{ matrix.platform }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.event.inputs.version, 'v') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nanobot-*

      - name: Collect release files
        run: |
          mkdir -p release
          find dist -name 'nanobot-*.tar.gz' -exec cp {} release/ \;
          find dist -name 'nanobot-*.zip' -exec cp {} release/ \;
          ls -lh release/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/nanobot-*
          generate_release_notes: true
