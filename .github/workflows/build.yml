name: Build Hey Nanobot

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            ext: .app
            artifact: hey-nanobot-macos-arm64
          - os: macos-13
            platform: darwin
            arch: amd64
            ext: .app
            artifact: hey-nanobot-macos-amd64
          - os: windows-latest
            platform: windows
            arch: amd64
            ext: .exe
            artifact: hey-nanobot-windows-amd64
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            ext: ''
            artifact: hey-nanobot-linux-amd64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}/${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: |
          wails build -platform ${{ matrix.platform }}/${{ matrix.arch }} -ldflags "-s -w -X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - name: Upload artifact (macOS)
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/hey-nanobot.app

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/hey-nanobot.exe

      - name: Upload artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/hey-nanobot

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package releases
        run: |
          cd dist
          # macOS arm64
          tar czf hey-nanobot-macos-arm64.tar.gz hey-nanobot-macos-arm64/
          # macOS amd64
          tar czf hey-nanobot-macos-amd64.tar.gz hey-nanobot-macos-amd64/
          # Windows
          zip -r hey-nanobot-windows-amd64.zip hey-nanobot-windows-amd64/
          # Linux
          tar czf hey-nanobot-linux-amd64.tar.gz hey-nanobot-linux-amd64/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hey-nanobot-macos-arm64.tar.gz
            dist/hey-nanobot-macos-amd64.tar.gz
            dist/hey-nanobot-windows-amd64.zip
            dist/hey-nanobot-linux-amd64.tar.gz
          generate_release_notes: true
